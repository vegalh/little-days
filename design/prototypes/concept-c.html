<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concept C: Minimal</title>
<link rel="stylesheet" href="shared.css">
<style>
/* Concept C: one question, then the answer. Picking an address goes straight to results,
   so nothing stands between the question and the map. */
html, body { height: 100%; }
body { overflow: hidden; }
.app { display: flex; flex-direction: column; height: calc(100dvh - var(--tabs)); }
.top { display: flex; flex: none; align-items: center; gap: 8px; height: 52px; padding: 0 8px 0 var(--gutter); }
.top .brand span { display: none; }
.top .lang { margin-left: auto; }
.ask { flex: none; padding: 0 var(--gutter); transition: margin-top .22s ease; }
.is-start .ask { margin-top: min(22dvh, 180px); }
.ask h1 { margin-bottom: 16px; font-size: 22px; text-align: center; }
.is-start .gf { box-shadow: 0 0 0 1px var(--line), 0 10px 28px rgba(38, 37, 31, .1); }
.is-start .gf:focus-within { box-shadow: inset 0 0 0 2px var(--accent-strong), 0 10px 28px rgba(38, 37, 31, .1); }
.ways { display: flex; justify-content: center; gap: 16px; margin-top: 8px; }
.ways .btn-text { display: inline-flex; align-items: center; gap: 4px; }
.pills { flex: none; padding: 8px var(--gutter); }
.is-start .pills { justify-content: center; margin-top: 16px; flex-wrap: wrap; }
.pills .chip { background: transparent; box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; }
.pills .chip[aria-pressed=true] { background: var(--selected); box-shadow: none; }
.map { flex: none; height: 34dvh; }
.results { flex: 1; min-height: 0; overflow-y: auto; padding: 0 var(--gutter) 16px; }
.summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0 4px; }
.summary h2 { font-size: 16px; }
.line { display: grid; grid-template-columns: 24px 1fr auto; gap: 4px 12px; align-items: start; width: 100%; padding: 12px 0; border-top: 1px solid var(--line); }
.line.on .line-name { color: var(--accent-strong); }
.line-name { display: block; margin: -10px 0; padding: 10px 0; font-size: 16px; font-weight: 700; text-align: left; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.line-idea { grid-column: 2 / 4; font-size: 14px; line-height: 20px; color: var(--ink-2); }
.line-time { font-size: 16px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.line-time small { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.line .class-note { grid-column: 2 / 4; margin: 0; }
.tail { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; padding-top: 8px; border-top: 1px solid var(--line); }
.loading { display: grid; place-items: center; flex: 1; font-size: 14px; color: var(--ink-2); }

@media (min-width: 960px) {
  body { overflow: hidden; }
  .app { height: 100vh; }
  .top { height: 72px; padding: 0 24px; }
  .top .brand span { display: inline; }
  .top .top-tabs { margin-left: auto; }
  .top .lang { margin-left: 16px; }
  .is-start .ask { width: 560px; margin: 18vh auto 0; }
  .is-start .ask h1 { font-size: 28px; }
  .done .split { flex: 1; min-height: 0; display: grid; grid-template-columns: 440px 1fr; grid-template-rows: auto auto 1fr; }
  .done .ask, .done .pills, .done .results { grid-column: 1; }
  .done .ask { padding: 0 24px; }
  .done .pills { padding: 8px 24px; flex-wrap: wrap; overflow: visible; }
  .done .results { padding: 0 24px 24px; }
  .done .map { grid-column: 2; grid-row: 1 / 4; height: auto; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="shared.js"></script>
<script>
const app = document.querySelector("#app");
let loading = false;
mountTabs();

const pills = () => `<div class="pills scroll-x">
  <button class="chip" type="button" data-filters aria-pressed="${state.minutes !== 15}">${walkLabel(state.minutes)}</button>
  <button class="chip" type="button" data-filters aria-pressed="${state.ages !== DEFAULTS.ages}">${t(state.ages)}</button>
  <button class="chip" type="button" data-filters aria-pressed="${state.mode !== "family"}">${t(state.mode === "family" ? "Family" : "Classroom")}</button>
  <button class="chip" type="button" data-filters aria-pressed="${state.interest !== "all"}">${state.interest === "all" ? t("Filters") : categoryLabel(state.interest)}</button></div>`;
const line = (place, i) => `<article class="line ${state.selected === place.id ? "on" : ""}" data-card="${place.id}">
  <span class="pin-num">${i + 1}</span><button class="line-name" type="button" data-open="${place.id}">${place.name}</button>
  <span class="line-time">${place.walk} <small>${t("min")}</small></span>
  <p class="line-idea">${pick(place.idea)}</p>${state.mode === "classroom" ? `<p class="class-note">${roundTrip(place.walk)} · ${t("Access not verified. Contact before a classroom visit.")}</p>` : ""}</article>`;

function render() {
  const value = state.location?.address || "";
  const top = `<header class="top">${brand}${protoTag()}${topTabs()}${langButton()}</header>`;
  if (!state.location) {
    app.className = "app is-start";
    app.innerHTML = `${top}<main class="ask"><h1>${t("Places to explore with children")}</h1><div id="field"></div>
      <div class="ways"><button class="btn-text" type="button" data-locate>${icon("locate", "icon-sm")}${t("Use my location")}</button><button class="btn-text" type="button" data-example>${t("Try an example")}</button></div></main>${pills()}`;
    mountField(document.querySelector("#field"));
    return;
  }
  const list = visiblePlaces();
  app.className = "app done";
  app.innerHTML = `${top}<main class="split"><div class="ask"><div id="field"></div></div>${pills()}
    ${loading ? `<div class="loading" role="status">${t("Searching…")}</div>` : `<div class="map" id="map"></div>
    <section class="results"><div class="summary"><h2>${placesLabel(list.length)}</h2><span class="meta">${weatherLine()}</span></div>
      ${list.length ? list.map(line).join("") : `<p>${t("No places match these filters.")}</p>`}
      <p class="tail"><span class="g-attr" translate="no">Google Maps</span><span class="sample">${t("Sample places, not real results")}</span></p></section>`}</main>`;
  mountField(document.querySelector("#field"));
  document.querySelector("#field input").value = value;
  if (!loading) {
    const wide = matchMedia("(min-width: 960px)").matches;
    drawMap(document.querySelector("#map"), wide ? { zoom: 1.2 } : { zoom: 0.62, cy: 428 });
  }
}
function changed(reason) {
  if (reason === "location") {
    loading = true;
    render();
    setTimeout(() => { loading = false; state.searched = true; render(); }, 650);
    return;
  }
  render();
}
document.addEventListener("click", (event) => {
  const pin = event.target.closest("[data-pin]");
  if (!pin) return;
  state.selected = +pin.dataset.pin;
  render();
  document.querySelector(`[data-card="${state.selected}"]`)?.scrollIntoView({ block: "nearest" });
});
addEventListener("resize", render);
setRender(changed);
startFromParams();
render();
openFromParams();
</script>
</body>
</html>
