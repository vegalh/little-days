<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little Days</title>
  <meta name="description" content="Weather-based activity ideas for young children, ages 1–6.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="./"><span aria-hidden="true">🌱</span> Little Days</a>
    </div>
  </header>

  <main>
    <div class="hero wrap">
      <h1>Every day holds a little adventure.</h1>
      <p>Weather-based activity ideas for curious little learners, ages 1–6.</p>

      <form id="search-form" class="controls" role="search" novalidate>
        <label for="city">City</label>
        <div class="city-row">
          <input id="city" name="city" type="text" autocomplete="address-level2" placeholder="e.g. Boston" autofocus>
          <button id="search-button" type="submit">Search</button>
        </div>
        <p id="city-message" class="field-message" hidden></p>
      </form>
    </div>

    <section class="wrap" aria-labelledby="week-heading">
      <div class="section-head">
        <h2 id="week-heading">This week</h2>
        <p id="place-line" hidden></p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <ol id="week" class="week" hidden></ol>
    </section>
  </main>

  <footer class="wrap">Weather by Open-Meteo</footer>

  <script src="app.js"></script>
</body>
</html>
